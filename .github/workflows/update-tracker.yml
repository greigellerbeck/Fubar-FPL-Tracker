name: Update FPL Tracker

on:
  schedule:
    # Runs daily at 22:00 UTC (00:00 SAST / Midnight South Africa time)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual trigger whenever you want

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate site
        run: python generate_site.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FPL tracker [skip ci]" && git push)
