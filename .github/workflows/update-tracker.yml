name: Update FPL Tracker

on:
  schedule:
    # 22:00 UTC = 00:00 SAST (Johannesburg, UTC+2, no daylight saving) --
    # i.e. runs right at midnight local time following Friday, Saturday,
    # Sunday, and Monday night football (Fri=5, Sat=6, Sun=0, Mon=1).
    - cron: '0 22 * * 0,1,5,6'
  workflow_dispatch: {}   # adds a manual "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python generate_site.py

      - name: Commit and push if the page changed
        run: |
          git config user.name "fpl-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
